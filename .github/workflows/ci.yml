name: Validate
on: [push, pull_request]
permissions:
  contents: read
jobs:
  contracts-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
      - uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: '10.0.x'
      - run: npm install --global pnpm@11.25.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm build
      - run: pnpm test
      - run: python -B -m unittest discover -s tests -p test_session_inventory.py
  windows-desktop:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore src/AgenticView.Desktop --locked-mode -p:NuGetAudit=false
      - run: dotnet publish src/AgenticView.Desktop --no-restore --no-self-contained -c Release -o dist/desktop
      - run: dotnet run --project tests/AgenticView.Desktop.Contracts -c Release
